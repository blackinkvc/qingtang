<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>青棠宗 · 图鉴</title>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="qt-ink.css">
<link rel="stylesheet" href="game-ui.css">
</head>
<body>
<div class="codex">

  <header class="cx-head">
    <div>
      <div style="font-family:var(--serif);font-size:11.5px;letter-spacing:.34em;color:var(--ink-3)">青 棠 宗 · 拾 茧</div>
      <h1 style="font-family:var(--serif);font-size:26px;letter-spacing:.2em;margin:6px 0 0;font-weight:600">图 鉴</h1>
    </div>
    <div class="prog">
      <span class="n" id="prog-n">0 / 0</span>
      <span class="bar"><i id="prog-i" style="width:0%"></i></span>
      <a href="index.html" style="font-size:12px;letter-spacing:.14em;color:var(--ink-3);border-bottom:1px solid var(--rule)">回裂缝</a>
    </div>
  </header>

  <nav class="cx-tabs" id="tabs"></nav>
  <div class="cards" id="cards"></div>

  <section class="cx-lat">
    <div class="cl-h">
      <span class="cl-t">茧 谱</span>
      <span class="cl-s">品阶 × 品类 × 凶吉</span>
    </div>
    <p class="cl-p">品类定其纹与属，品阶定茧衣厚薄与光泽，凶吉只留在壳面：裂、净、纹。谱上二十五格，即缝口可能捡到的全部。</p>
    <div class="cl-grid" id="lattice"></div>
    <div class="cl-foot">
      <span class="om x">裂 · 凶</span><span class="om p">净 · 平</span><span class="om j">纹 · 吉</span>
      <span class="cl-n">25 谱 · 自上而下，品阶递降</span>
    </div>
  </section>

  <div style="margin-top:26px;font-size:11.5px;color:var(--ink-4);letter-spacing:.1em;line-height:2">
    未识之物只留轮廓与序次；已收录者标注出处与稀有度。<br>
    配图编号与条目对应：<code class="mono">c-</code> 场景 · <code class="mono">k-</code> 茧 · <code class="mono">m-</code> 妖魔 · <code class="mono">p-</code> 人物 · <code class="mono">e-</code> 事件 · <code class="mono">b-</code> 残卷。未出图者留空栏，不碍收录。
  </div>
</div>

<footer class="g-bottom">
  <nav class="navbar">
    <a href="index.html"><i class="dot"></i>裂缝</a>
    <a href="codex.html" class="on"><i class="dot"></i>图鉴</a>
    <a href="hatchery.html"><i class="dot"></i>孵房</a>
    <a href="market.html"><i class="dot"></i>贩卖</a>
    <a href="index.html#plots"><i class="dot"></i>育茧畦</a>
    <a href="index.html#vault"><i class="dot"></i>库藏</a>
  </nav>
  <div class="login">
    <span class="t" id="log">图鉴所录，皆拾茧者亲见。</span>
    <span class="mono" style="font-size:10.5px;color:var(--ink-4)" id="clock">--:--</span>
  </div>
</footer>

<script src="store.js"></script>
<script src="codex-data.js"></script>
<script src="assets-ledger.js"></script>
<script>
var S = QT.load();
var DATA = CODEX;
var order = ["cocoon","thing","person","event","book"];
var cur = "cocoon";
var RAR = ["", "凡", "良", "珍", "秘", "绝"];

/* 与条目 need 前缀对应的计数 */
var T = {
  s: S.pick || 0,
  t: S.steals || 0,
  y: (S.secrets && S.secrets.fines) || 0,
  w: S.whispers || 0,
  k: QT.kinN(),
  a: (S.codex || []).length,
  r: S.hadRift ? 1 : 0,
  b: S.hadBond ? 1 : 0,
  m: S.taints || 0
};

function ok(it){
  if (!it.need) return true;
  if (it.need.indexOf('c:') === 0 || it.need.indexOf('f:') === 0) {
    return !!(S.seen && S.seen[it.need]);
  }
  var p = it.need.split(':');
  return (T[p[0]] || 0) >= +p[1];
}

order.forEach(function(k){
  DATA[k].items.forEach(function(it){ it._ok = ok(it); });
});

/* 鉴定记录：从本档读 */
var arr = (S.codex || []).map(function(x){
  var nm = (QT.KINDS[x.kind] || {}).n || '茧';
  return {
    t: nm, r: x.r, no: 'a-' + x.id, _ok: true,
    m: [RAR[x.r] + '品', x.v, x.lo + '–' + x.hi + ' 石', '缝势 ' + x.rift],
    d: new Date(x.at).toLocaleDateString() + ' 鉴 · 费 ' + x.fee + ' 石'
  };
});
if (!arr.length) arr = [{ t: '', r: 0, no: 'a-00', m: [], d: '', _ok: true }];
DATA.appraise = { name: '鉴定记录', items: arr };
order.push('appraise');

var hd = (S.heard || []).map(function(h, i){
  var km = S.gods && S.gods[h.g] && S.gods[h.g].kin ? ' · 眷属' : '';
  return { t: ((QT.GODS[h.g] || {}).n || '') + km, r: 0, no: 'w-' + ('0' + (i + 1)).slice(-2), _ok: true,
           m: [new Date(h.at).toLocaleString('zh-CN', { hour12: false }), '清明 ' + h.clarity],
           d: h.line || '（无声）' };
});
if (!hd.length) hd = [{ t: '', r: 0, no: 'w-00', m: [], d: '', _ok: true }];
DATA.whisper = { name: '低语', items: hd };
order.push('whisper');

function renderTabs(){
  var n = 0;
  var host = document.getElementById("tabs");
  host.innerHTML = order.map(function(k){
    var d = DATA[k], got = d.items.filter(function(x){ return x._ok !== false; }).length;
    n += got;
    return '<button class="cx-tab' + (k === cur ? ' on' : '') + '" data-k="' + k + '">'
      + d.name + '<span class="c">' + got + '/' + d.items.length + '</span></button>';
  }).join("");
  host.querySelectorAll(".cx-tab").forEach(function(b){
    b.onclick = function(){ cur = b.dataset.k; renderTabs(); renderCards(); };
  });
  var total = order.reduce(function(a,k){ return a + DATA[k].items.length; }, 0);
  document.getElementById("prog-n").textContent = n + " / " + total;
  document.getElementById("prog-i").style.width = (n / total * 100).toFixed(1) + "%";
}

function pic(x){
  if(x.img){
    return '<div class="pic"><img src="' + x.img + '" alt="' + x.t + '" loading="lazy"'
      + ' onerror="var p=this.parentNode;p.className=\'pic ph\';p.textContent=\'' + x.no + ' · 待出\'"></div>';
  }
  /* 缺图槽位：走素材台账的占位卡，点开有完整说明 */
  var r = window.QTLedger && QTLedger.ready() ? QTLedger.byCodex(x.no) : null;
  if (r) return QTLedger.placeholder(r);
  return '<div class="pic ph">' + x.no + ' · 待出</div>';
}

function renderCards(){
  var items = DATA[cur].items;
  document.getElementById("cards").innerHTML = items.map(function(x, i){
    var no = x.no || String(i + 1).padStart(2, "0");
    if(!x.t || x._ok === false){
      return '<article class="cx-card lock">' + pic({ no: no })
        + '<div class="no">' + no + '</div>'
        + '<div class="ttl">未 识</div><div class="desc">待解封</div></article>';
    }
    return '<article class="cx-card">' + pic(x)
      + '<span class="seal-lock">已录</span>'
      + '<div class="no">' + no + '</div>'
      + '<div class="ttl">' + x.t + '</div>'
      + '<div class="meta">' + (x.r ? '<span class="rar r' + x.r + '">' + RAR[x.r] + '</span>' : '')
      + x.m.map(function(m){ return '<span>' + m + '</span>'; }).join("") + '</div>'
      + '<div class="desc">' + x.d + '</div></article>';
  }).join("");
}

renderTabs(); renderCards();

/* 台账是异步加载的，到位后重绘一次，把缺图槽位换成占位卡 */
document.addEventListener('qtledger:ready', function(){ renderTabs(); renderCards(); });

/* 茧谱：二十五格，按三维规则现画 */
(function(){
  var C = QT.COCOON, h = '';
  h += '<div class="cl-cell cl-corner"></div>';
  C.kinds.forEach(function(K){
    h += '<div class="cl-cell cl-th">' + K.n + '<span>' + K.y + '</span></div>';
  });
  for (var g = 5; g >= 1; g--) {
    h += '<div class="cl-cell cl-th cl-gr"><b>' + C.grades[g].n + '</b><span>' + C.grades[g].dur + ' min</span></div>';
    for (var k = 0; k < 5; k++) {
      var ph = QT.phase(k, g), got = S.seen && S.seen['c:' + k + ':' + g];
      var om = ph.omen === '凶' ? 'x' : ph.omen === '吉' ? 'j' : 'p';
      h += '<div class="cl-cell cl-c' + (got ? ' on' : '') + '">'
        + '<div class="cl-svg">' + QT.svg({ id: 'L' + k + g, kind: k, r: g, w: .74, h: 0 }, { sfx: 'L' }) + '</div>'
        + '<div class="cl-nm">' + C.kinds[k].n.replace('茧', '') + ' · ' + C.grades[g].n + '</div>'
        + '<div class="cl-om ' + om + '">' + C.omens[ph.omen].vis + '</div></div>';
    }
  }
  document.getElementById('lattice').innerHTML = h;
})();

(function tick(){
  var d = new Date();
  document.getElementById('clock').textContent = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
})();
</script>
</body>
</html>
