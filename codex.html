<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>青棠宗 · 图鉴</title>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="qt-ink.css">
<link rel="stylesheet" href="game-ui.css">
</head>
<body>
<div class="codex">

  <header class="cx-head">
    <div>
      <div style="font-family:var(--serif);font-size:11.5px;letter-spacing:.34em;color:var(--ink-3)">青 棠 宗 · 拾 茧</div>
      <h1 style="font-family:var(--serif);font-size:26px;letter-spacing:.2em;margin:6px 0 0;font-weight:600">图 鉴</h1>
    </div>
    <div class="prog">
      <span class="n" id="prog-n">0 / 0</span>
      <span class="bar"><i id="prog-i" style="width:0%"></i></span>
      <a href="index.html" style="font-size:12px;letter-spacing:.14em;color:var(--ink-3);border-bottom:1px solid var(--rule)">回裂缝</a>
    </div>
  </header>

  <nav class="cx-tabs" id="tabs"></nav>
  <div class="cards" id="cards"></div>

  <div style="margin-top:26px;font-size:11.5px;color:var(--ink-4);letter-spacing:.1em;line-height:2">
    未识之物只留轮廓与序次；已收录者标注出处与稀有度。<br>
    配图编号与条目对应：<code class="mono">c-</code> 场景 · <code class="mono">k-</code> 茧 · <code class="mono">m-</code> 妖魔 · <code class="mono">b-</code> 残卷 · <code class="mono">e-</code> 事件。未出图者留空栏，不碍收录。
  </div>
</div>

<footer class="g-bottom">
  <nav class="navbar">
    <a href="index.html"><i class="dot"></i>裂缝</a>
    <a href="codex.html" class="on"><i class="dot"></i>图鉴</a>
    <a href="hatchery.html"><i class="dot"></i>孵房</a>
    <a href="market.html"><i class="dot"></i>贩卖</a>
    <a href="index.html#plots"><i class="dot"></i>育茧畦</a>
    <a href="index.html#vault"><i class="dot"></i>库藏</a>
  </nav>
  <div class="login">
    <span class="t" id="log">图鉴所录，皆拾茧者亲见。</span>
    <span class="mono" style="font-size:10.5px;color:var(--ink-4)" id="clock">--:--</span>
  </div>
</footer>

<script src="store.js"></script>
<script>
var DATA = {
  cocoon: {name:"茧", items:[
    {t:"青皮茧", r:1, no:"k-01", img:"assets/gen/k-01-qingpi.jpg", m:["中品","偏木","生长期 18 min"], d:"最常见的青皮，茧衣薄，透出隐约的木气。"},
    {t:"赭纹茧", r:2, no:"k-02", m:["中品","偏土","生长期 26 min"], d:"茧衣有赭色横纹，土气沉稳，宜培不宜急。"},
    {t:"白霜茧", r:2, no:"k-03", m:["上品","偏水","生长期 32 min"], d:"霜色覆壳，触之生寒，多生于裂缝阴面。"},
    {t:"朱砂茧", r:3, no:"k-04", m:["上品","偏火","生长期 14 min"], d:"壳内似有火脉游走，熟时微微发烫。"},
    {t:"藕紫茧", r:4, no:"k-05", m:["异品","倾向不明","生长期 40 min"], d:"紫而不艳，宗门记载中仅三见。对着它久了，会忘记时辰。"},
    {t:"", r:0, no:"k-06", m:[], d:""},
    {t:"", r:0, no:"k-07", m:[], d:""},
    {t:"", r:0, no:"k-08", m:[], d:""}
  ]},
  thing: {name:"茧中物", items:[
    {t:"残锋", r:2, no:"m-02", m:["真物","出自·青皮茧"], d:"断去半截的短锋，仍可割裂薄茧。"},
    {t:"空壳", r:1, no:"m-03", m:["空壳","可回收 5 石"], d:"孵后仅余茧衣，卷起如纸。"},
    {t:"青面小妖", r:3, no:"m-01", img:"assets/gen/m-01-qingmian.jpg", m:["妖魔","镇压 30%–55%"], d:"孵自贼手之茧，见人即扑，需以神识镇之。"},
    {t:"废纸一叠", r:1, no:"m-04", m:["无意义物","灰料"], d:"湿烂的纸，辨不出一个字。"},
    {t:"细线", r:2, no:"m-05", m:["非茧丝","断口齐整"], d:"一根极细的线，不是茧丝。断口平整，像被人从另一端抽走。"},
    {t:"冷石", r:1, no:"m-06", m:["缝口拾得","贴身不凉"], d:"从缝口捡的石头。揣在怀里，贴着皮肉，一直是温的。"},
  ]},
  person: {name:"人物", items:[
    {t:"沈砚", r:2, no:"p-01", m:["外门","筑基三层"], d:"好拾茧，手快，窃名一条。近来开茧不开灯。"},
    {t:"柳七娘", r:3, no:"p-02", m:["内门","金丹一层","掌育茧畦"], d:"畦中之茧多半经她手，话少。问起沈砚，只说：他数茧数得比谁都细。"},
    {t:"守缝人", r:4, no:"p-03", m:["身份不明"], d:"常立于裂缝侧，不问不答。沈砚站过去时，他会让开半步。"},
    {t:"顾岐", r:2, no:"p-04", m:["外门","师兄"], d:"总说各人有各人的路。别人问沈砚的路通向哪里，他就不说了。"},
    {t:"郑小满", r:1, no:"p-05", m:["同门","贩卖处"], d:"卖茧爱抬价。说沈砚开出来的壳总是空的，人也越来越静。"}
  ]},
  event: {name:"事件", items:[
    {t:"初拾", r:1, no:"e-01", img:"assets/gen/c-01-rift.jpg", m:["辛亥年·霜降","裂缝"], d:"第一次拾得不明之茧，囊中微沉。"},
    {t:"窃名", r:2, no:"e-02", m:["同门畦","未遂"], d:"手未落而人已至，记窃名一条。"},
    {t:"夜坐", r:1, no:"e-03", m:["缝边","至天明"], d:"在缝边坐到天亮。回房时鞋底是湿的，缝边并未下雨。"},
    {t:"数茧", r:1, no:"e-04", m:["房中","第三遍"], d:"一夜数了三遍。每遍数目都对，还是又数了一遍。"}
  ]},
  book: {name:"书籍残片", items:[
    {t:"《茧谱》卷上", r:3, no:"b-01", m:["残卷","存 12 页 / 全 40 页"], d:"记茧之品阶与倾性，缺下半。"},
    {t:"《缝口杂记》", r:3, no:"b-02", m:["残页","字迹渐软"], d:"残页上反复写着同一句：它在听。一封比一封写得软。"},
    {t:"《红线谱》", r:2, no:"b-03", m:["残卷","借者不详"], d:"讲牵线之法。借书人的名字被磨去了，只剩一个沈字。"}
  ]}
};

var order = ["cocoon","thing","person","event","book"];
var cur = "cocoon";
var RAR = ["", "凡", "良", "珍", "秘", "绝"];

/* 鉴定记录：从本档读 */
if (window.QT){
  var S = QT.load();
  var arr = (S.codex || []).map(function(x){
    var nm = (QT.KINDS[x.kind] || {}).n || '茧';
    return {
      t: nm, r: x.r, no: 'a-' + x.id,
      m: [RAR[x.r] + '品', x.v, x.lo + '–' + x.hi + ' 石', '缝势 ' + x.rift],
      d: new Date(x.at).toLocaleDateString() + ' 鉴 · 费 ' + x.fee + ' 石'
    };
  });
  if (!arr.length) arr = [{ t: '', r: 0, no: 'a-00', m: [], d: '' }];
  DATA.appraise = { name: '鉴定记录', items: arr };
  order.push('appraise');

  var hd = (S.heard || []).map(function(h){
    var nm = (QT.GODS[h.g] || {}).n || '';
    return { t: nm, r: 0, no: 'w-' + h.at, m: ['清明 ' + h.clarity],
             d: new Date(h.at).toLocaleString('zh-CN', { hour12: false }) };
  });
  if (!hd.length) hd = [{ t: '', r: 0, no: 'w-00', m: [], d: '' }];
  DATA.whisper = { name: '低语', items: hd };
  order.push('whisper');
}

function renderTabs(){
  var n = 0;
  var host = document.getElementById("tabs");
  host.innerHTML = order.map(function(k){
    var d = DATA[k], got = d.items.filter(function(x){ return x.t; }).length;
    n += got;
    return '<button class="cx-tab' + (k === cur ? ' on' : '') + '" data-k="' + k + '">'
      + d.name + '<span class="c">' + got + '/' + d.items.length + '</span></button>';
  }).join("");
  host.querySelectorAll(".cx-tab").forEach(function(b){
    b.onclick = function(){ cur = b.dataset.k; renderTabs(); renderCards(); };
  });
  var total = order.reduce(function(a,k){ return a + DATA[k].items.length; }, 0);
  document.getElementById("prog-n").textContent = n + " / " + total;
  document.getElementById("prog-i").style.width = (n / total * 100).toFixed(1) + "%";
}

function pic(x){
  if(x.img){
    return '<div class="pic"><img src="' + x.img + '" alt="' + x.t + '" loading="lazy"'
      + ' onerror="var p=this.parentNode;p.className=\'pic ph\';p.textContent=\'' + x.no + ' · 待出\'"></div>';
  }
  return '<div class="pic ph">' + x.no + ' · 待出</div>';
}

function renderCards(){
  var items = DATA[cur].items;
  document.getElementById("cards").innerHTML = items.map(function(x, i){
    var no = x.no || String(i + 1).padStart(2, "0");
    if(!x.t){
      return '<article class="cx-card lock">' + pic(x)
        + '<div class="no">' + no + '</div>'
        + '<div class="ttl">未 识</div><div class="desc">待解封</div></article>';
    }
    return '<article class="cx-card">' + pic(x)
      + '<span class="seal-lock">已录</span>'
      + '<div class="no">' + no + '</div>'
      + '<div class="ttl">' + x.t + '</div>'
      + '<div class="meta">' + (x.r ? '<span class="rar r' + x.r + '">' + RAR[x.r] + '</span>' : '')
      + x.m.map(function(m){ return '<span>' + m + '</span>'; }).join("") + '</div>'
      + '<div class="desc">' + x.d + '</div></article>';
  }).join("");
}

renderTabs(); renderCards();

(function tick(){
  var d = new Date();
  document.getElementById('clock').textContent = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
})();
</script>
</body>
</html>
